# Build is immutable and never connects to the production database.
# Railway runs migrations once in pre-deploy before starting replicas.
[build]
buildCommand = "npm run build"

[deploy]
# Railway runs this after build and before starting immutable app replicas.
preDeployCommand = "npm run release:migrate"
startCommand = "next start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
